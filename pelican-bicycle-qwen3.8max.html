<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画（Qwen3.8-Max 版）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(150deg, #241f33 0%, #3d2f45 45%, #5a3f47 100%);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 1000px;
    background: #1d1a26;
    border-radius: 22px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    padding: 26px 26px 18px;
    border: 1px solid rgba(255, 255, 255, 0.07);
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(20px, 3vw, 28px);
    color: #fdeede;
    letter-spacing: 1px;
  }
  h1 .tag {
    font-size: 0.5em;
    font-weight: 600;
    color: #ffc46b;
    border: 1px solid rgba(255, 196, 107, 0.45);
    border-radius: 999px;
    padding: 3px 10px;
    vertical-align: middle;
    margin-inline-start: 8px;
    letter-spacing: 0.5px;
  }
  .sub { margin: 0 0 16px; font-size: 13px; color: #9d93ac; }
  .stage {
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.09);
    cursor: pointer;
    position: relative;
  }
  svg { display: block; width: 100%; height: auto; }
  .foot { margin-top: 12px; font-size: 12px; color: #7d7489; text-align: center; }
</style>
</head>
<body>
<main class="card">
  <h1>🚲 黄昏骑行 · 鹈鹕<span class="tag">Qwen3.8-Max 版</span></h1>
  <p class="sub">纯 SVG + SMIL 矢量动画 · 六层视差背景 / 双骨 IK 蹬踏 / 踏板恒水平 / 链条·车轮·围巾·眨眼全联动</p>

  <div class="stage">
  <svg viewBox="0 0 960 600" role="img"
       aria-label="黄昏路上，一只系红围巾的白色鹈鹕骑着青色自行车前行，车筐里有一条鱼">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#2f4a72"/>
        <stop offset="0.42" stop-color="#d9835f"/>
        <stop offset="0.72" stop-color="#f6b479"/>
        <stop offset="1"    stop-color="#ffd9a5"/>
      </linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"   stop-color="#fff3c9" stop-opacity="0.85"/>
        <stop offset="0.5" stop-color="#ffbe77" stop-opacity="0.35"/>
        <stop offset="1"   stop-color="#ff9d5c" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7d889c"/>
        <stop offset="1" stop-color="#5d6577"/>
      </linearGradient>
    </defs>

    <!-- ===== 天空 ===== -->
    <rect width="960" height="600" fill="url(#sky)"/>

    <!-- ===== 落日（光晕呼吸 + 光芒慢转） ===== -->
    <circle cx="778" cy="196" r="150" fill="url(#glow)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#ffcf7a" stroke-width="4" stroke-linecap="round" opacity="0.45">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 778 196" to="360 778 196" dur="120s" repeatCount="indefinite"/>
        <line x1="778" y1="86"  x2="778" y2="58"/>
        <line x1="778" y1="86"  x2="778" y2="58"  transform="rotate(45 778 196)"/>
        <line x1="778" y1="86"  x2="778" y2="58"  transform="rotate(90 778 196)"/>
        <line x1="778" y1="86"  x2="778" y2="58"  transform="rotate(135 778 196)"/>
        <line x1="778" y1="86"  x2="778" y2="58"  transform="rotate(180 778 196)"/>
        <line x1="778" y1="86"  x2="778" y2="58"  transform="rotate(225 778 196)"/>
        <line x1="778" y1="86"  x2="778" y2="58"  transform="rotate(270 778 196)"/>
        <line x1="778" y1="86"  x2="778" y2="58"  transform="rotate(315 778 196)"/>
      </g>
    </g>
    <circle cx="778" cy="196" r="52" fill="#ffd479"/>
    <circle cx="778" cy="196" r="52" fill="#ff9d5c" opacity="0.25"/>

    <!-- ===== 归巢的飞鸟（横掠 + 拍翅） ===== -->
    <g fill="none" stroke="#4a3b52" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
      <g>
        <animateTransform attributeName="transform" type="translate"
          from="1040 0" to="-160 -46" dur="34s" repeatCount="indefinite"/>
        <path d="M0 132 q7 -7 14 0 q7 -7 14 0">
          <animate attributeName="d" values="M0 132 q7 -7 14 0 q7 -7 14 0;M0 130 q7 5 14 0 q7 5 14 0;M0 132 q7 -7 14 0 q7 -7 14 0"
            dur="0.7s" repeatCount="indefinite"/>
        </path>
        <path d="M46 108 q6 -6 12 0 q6 -6 12 0" transform="scale(0.8)">
          <animate attributeName="d" values="M46 108 q6 -6 12 0 q6 -6 12 0;M46 106 q6 5 12 0 q6 5 12 0;M46 108 q6 -6 12 0 q6 -6 12 0"
            dur="0.62s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- ===== 云（两层视差） ===== -->
    <g opacity="0.5">
      <g id="cloudA" fill="#ffd9b0">
        <ellipse cx="150" cy="112" rx="66" ry="15"/>
        <ellipse cx="112" cy="122" rx="40" ry="11"/>
        <ellipse cx="200" cy="122" rx="44" ry="12"/>
        <g transform="translate(470 46) scale(0.72)">
          <ellipse cx="150" cy="112" rx="66" ry="15"/>
          <ellipse cx="200" cy="122" rx="44" ry="12"/>
        </g>
      </g>
      <use href="#cloudA" x="960"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-960 0" dur="96s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.38">
      <g id="cloudB" fill="#fff0d8">
        <g transform="translate(40 176) scale(0.55)">
          <ellipse cx="150" cy="112" rx="66" ry="15"/>
          <ellipse cx="112" cy="122" rx="40" ry="11"/>
        </g>
        <g transform="translate(520 206) scale(0.46)">
          <ellipse cx="150" cy="112" rx="66" ry="15"/>
          <ellipse cx="200" cy="122" rx="44" ry="12"/>
        </g>
      </g>
      <use href="#cloudB" x="960"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-960 0" dur="64s" repeatCount="indefinite"/>
    </g>

    <!-- ===== 远山（视差 58s） ===== -->
    <g>
      <g id="ridge1">
        <path d="M0 452 L110 372 L182 424 L268 350 L360 430 L452 366 L556 438 L660 378 L752 434 L858 382 L960 452 L960 470 L0 470 Z"
              fill="#6d5b83" opacity="0.85"/>
      </g>
      <use href="#ridge1" x="960"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-960 0" dur="58s" repeatCount="indefinite"/>
    </g>

    <!-- ===== 中景林带（视差 24s） ===== -->
    <g>
      <g id="ridge2">
        <path d="M0 462 Q120 430 240 456 Q370 480 500 448 Q640 414 760 458 Q860 486 960 462 L960 486 L0 486 Z" fill="#4d6b62"/>
        <g fill="#3f5a53">
          <path d="M96 450 L83 428 L90 428 L85 410 L96 398 L107 410 L102 428 L109 428 Z"/>
          <path d="M356 466 L343 444 L350 444 L345 426 L356 414 L367 426 L362 444 L369 444 Z"/>
          <path d="M636 436 L623 414 L630 414 L625 396 L636 384 L647 396 L642 414 L649 414 Z"/>
          <path d="M876 472 L863 450 L870 450 L865 432 L876 420 L887 432 L882 450 L889 450 Z"/>
        </g>
      </g>
      <use href="#ridge2" x="960"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-960 0" dur="24s" repeatCount="indefinite"/>
    </g>

    <!-- ===== 草地基带 ===== -->
    <rect x="0" y="470" width="960" height="28" fill="#5f8f4a"/>

    <!-- ===== 近景灌木（视差 9s） ===== -->
    <g>
      <g id="ridge3">
        <g fill="#3d6b45">
          <ellipse cx="70"  cy="484" rx="58" ry="20"/>
          <ellipse cx="150" cy="488" rx="42" ry="14"/>
          <ellipse cx="410" cy="484" rx="66" ry="22"/>
          <ellipse cx="492" cy="490" rx="40" ry="13"/>
          <ellipse cx="742" cy="485" rx="56" ry="19"/>
          <ellipse cx="820" cy="490" rx="44" ry="14"/>
        </g>
      </g>
      <use href="#ridge3" x="960"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-960 0" dur="9s" repeatCount="indefinite"/>
    </g>

    <!-- ===== 路肩 + 路面 ===== -->
    <rect x="0" y="490" width="960" height="8"  fill="#4c7a3c"/>
    <rect x="0" y="496" width="960" height="104" fill="url(#road)"/>
    <rect x="0" y="496" width="960" height="4"  fill="#9aa5b6" opacity="0.8"/>

    <!-- 路肩草丛小花（与路面同速滚动，3s / 960px ≈ 车轮线速度） -->
    <g>
      <g id="shoulder">
        <g stroke="#43722f" stroke-width="2.6" stroke-linecap="round" fill="none">
          <path d="M64 492 q2 -15 8 -20 M71 492 q5 -11 11 -14 M58 492 q-2 -10 -7 -13"/>
          <path d="M286 492 q2 -13 7 -18 M293 492 q5 -10 11 -12"/>
          <path d="M520 492 q2 -15 8 -20 M527 492 q5 -11 11 -14 M514 492 q-2 -10 -7 -13"/>
          <path d="M744 492 q2 -13 7 -18 M751 492 q5 -10 11 -12"/>
          <path d="M896 492 q2 -15 8 -20 M903 492 q5 -11 11 -14"/>
        </g>
        <g>
          <line x1="182" y1="491" x2="182" y2="478" stroke="#43722f" stroke-width="2"/>
          <circle cx="182" cy="475" r="3.8" fill="#ff9d7a"/>
          <line x1="628" y1="491" x2="628" y2="479" stroke="#43722f" stroke-width="2"/>
          <circle cx="628" cy="476" r="3.5" fill="#ffd479"/>
        </g>
      </g>
      <use href="#shoulder" x="960"/>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-960 0" dur="3s" repeatCount="indefinite"/>
    </g>

    <!-- 路面中央虚线（快速左移） -->
    <g>
      <line x1="-140" y1="552" x2="1100" y2="552"
            stroke="#ffe9c9" stroke-width="8" stroke-dasharray="64 44" opacity="0.75"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -108 0" dur="0.3375s" repeatCount="indefinite"/>
    </g>

    <!-- ===== 车后速度线（闪烁 + 后掠） ===== -->
    <g fill="#fff2dd">
      <g>
        <rect x="92" y="318" width="96" height="6" rx="3"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="1.1s" begin="0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -62 0" dur="1.1s" begin="0s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="52" y="372" width="128" height="6" rx="3"/>
        <animate attributeName="opacity" values="0;0.75;0" dur="1.1s" begin="0.37s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -62 0" dur="1.1s" begin="0.37s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="104" y="424" width="82" height="6" rx="3"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="1.1s" begin="0.74s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -62 0" dur="1.1s" begin="0.74s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- ===== 地面阴影（随颠簸呼吸） ===== -->
    <ellipse cx="490" cy="500" rx="216" ry="10" fill="#2b2438" opacity="0.34">
      <animate attributeName="rx" values="216;206;216;210;216" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.34;0.28;0.34;0.30;0.34" dur="0.9s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ===== 后轮扬起的尘土 ===== -->
    <g fill="#e8dcc8">
      <circle cx="252" cy="492" r="4">
        <animate attributeName="r" values="3;13;3" dur="0.9s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0;0" dur="0.9s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="256;206;256" dur="0.9s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="252" cy="486" r="3">
        <animate attributeName="r" values="2;10;2" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="252;212;252" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="252" cy="494" r="3">
        <animate attributeName="r" values="2;11;2" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0;0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="254;210;254" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============================================================
         鹈鹕 + 自行车（整体颠簸 0.45s = 曲柄半圈）
         ============================================================ -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -3.4; 0 0; 0 -2.2; 0 0" dur="0.9s" repeatCount="indefinite"/>

      <!-- ---- 远侧腿（暗色，相位落后近腿半圈） ---- -->
      <path fill="none" stroke="#c07a20" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
            d="M410 300 L485.2 359.6 L426.0 430.0 l20 6">
        <animate attributeName="d" dur="0.9s" repeatCount="indefinite" calcMode="linear" values="
          M410 300 L485.2 359.6 L426.0 430.0 l20 6;
          M410 300 L494.0 346.4 L430.6 413.0 l20 6;
          M410 300 L501.4 329.4 L443.0 400.6 l20 6;
          M410 300 L504.7 315.6 L460.0 396.0 l20 6;
          M410 300 L505.1 313.0 L477.0 400.6 l20 6;
          M410 300 L503.4 322.1 L489.4 413.0 l20 6;
          M410 300 L498.1 338.1 L494.0 430.0 l20 6;
          M410 300 L488.7 355.0 L489.4 447.0 l20 6;
          M410 300 L478.3 367.5 L477.0 459.4 l20 6;
          M410 300 L472.5 372.9 L460.0 464.0 l20 6;
          M410 300 L473.0 372.5 L443.0 459.4 l20 6;
          M410 300 L477.7 368.0 L430.6 447.0 l20 6;
          M410 300 L485.2 359.6 L426.0 430.0 l20 6"/>
      </path>

      <!-- ---- 后轮 ---- -->
      <g>
        <circle cx="300" cy="430" r="68" fill="none" stroke="#2b2b2b" stroke-width="10"/>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="0 300 430" to="360 300 430" dur="1.35s" repeatCount="indefinite"/>
          <circle cx="300" cy="430" r="58" fill="none" stroke="#d8dee3" stroke-width="5"/>
          <g stroke="#9fb0bb" stroke-width="2.2">
            <line x1="300" y1="430" x2="357" y2="430"/>
            <line x1="300" y1="430" x2="340.4" y2="470.4"/>
            <line x1="300" y1="430" x2="300"   y2="487"/>
            <line x1="300" y1="430" x2="259.6" y2="470.4"/>
            <line x1="300" y1="430" x2="243"   y2="430"/>
            <line x1="300" y1="430" x2="259.6" y2="389.6"/>
            <line x1="300" y1="430" x2="300"   y2="373"/>
            <line x1="300" y1="430" x2="340.4" y2="389.6"/>
          </g>
          <circle cx="300" cy="380" r="3.6" fill="#ff9d5c"/>
        </g>
        <circle cx="300" cy="430" r="9" fill="#3a3a3a"/>
      </g>

      <!-- ---- 前轮 ---- -->
      <g>
        <circle cx="680" cy="430" r="68" fill="none" stroke="#2b2b2b" stroke-width="10"/>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="0 680 430" to="360 680 430" dur="1.35s" repeatCount="indefinite"/>
          <circle cx="680" cy="430" r="58" fill="none" stroke="#d8dee3" stroke-width="5"/>
          <g stroke="#9fb0bb" stroke-width="2.2">
            <line x1="680" y1="430" x2="737" y2="430"/>
            <line x1="680" y1="430" x2="720.4" y2="470.4"/>
            <line x1="680" y1="430" x2="680"   y2="487"/>
            <line x1="680" y1="430" x2="639.6" y2="470.4"/>
            <line x1="680" y1="430" x2="623"   y2="430"/>
            <line x1="680" y1="430" x2="639.6" y2="389.6"/>
            <line x1="680" y1="430" x2="680"   y2="373"/>
            <line x1="680" y1="430" x2="720.4" y2="389.6"/>
          </g>
          <circle cx="680" cy="380" r="3.6" fill="#ff9d5c"/>
        </g>
        <circle cx="680" cy="430" r="9" fill="#3a3a3a"/>
      </g>

      <!-- ---- 车架 ---- -->
      <g stroke="#17607d" stroke-linecap="round" fill="none">
        <line x1="460" y1="430" x2="300" y2="430" stroke-width="8"/>
        <line x1="404" y1="296" x2="300" y2="430" stroke-width="7"/>
        <line x1="460" y1="430" x2="406" y2="306" stroke-width="9"/>
        <line x1="460" y1="430" x2="650" y2="344" stroke-width="9"/>
        <line x1="404" y1="296" x2="640" y2="302" stroke-width="8"/>
        <line x1="640" y1="300" x2="656" y2="350" stroke-width="10"/>
        <line x1="656" y1="350" x2="680" y2="430" stroke-width="8"/>
      </g>
      <g stroke="#1f87ab" stroke-width="2" opacity="0.7" fill="none" stroke-linecap="round">
        <line x1="466" y1="424" x2="640" y2="344"/>
        <line x1="410" y1="300" x2="632" y2="306"/>
      </g>
      <!-- 座杆 + 车座（略低于腹部，露出座垫下半部） -->
      <line x1="406" y1="312" x2="402" y2="298" stroke="#2f2f2f" stroke-width="7" stroke-linecap="round"/>
      <path d="M368 302 Q398 292 430 302 Q400 312 368 302 Z" fill="#2b2b2b"/>
      <!-- 车把 -->
      <line x1="640" y1="300" x2="632" y2="276" stroke="#2f2f2f" stroke-width="7" stroke-linecap="round"/>
      <path d="M600 272 Q632 262 664 274" fill="none" stroke="#2f2f2f" stroke-width="8" stroke-linecap="round"/>
      <line x1="598" y1="271" x2="614" y2="268" stroke="#e0453a" stroke-width="9" stroke-linecap="round"/>
      <line x1="650" y1="271" x2="666" y2="275" stroke="#e0453a" stroke-width="9" stroke-linecap="round"/>
      <!-- 铃铛 -->
      <line x1="636" y1="264" x2="636" y2="254" stroke="#2f2f2f" stroke-width="2.5"/>
      <circle cx="636" cy="249" r="6" fill="#ffd479" stroke="#d9a520" stroke-width="1.6">
        <animateTransform attributeName="transform" type="rotate"
          values="-10 636 256; 10 636 256; -10 636 256" dur="1.35s" repeatCount="indefinite"/>
      </circle>

      <!-- ---- 链条（上下股反向流动） ---- -->
      <g stroke="#4a4a4a" stroke-width="4" stroke-dasharray="7 5" fill="none">
        <line x1="300" y1="421" x2="460" y2="409">
          <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.36s" repeatCount="indefinite"/>
        </line>
        <line x1="300" y1="439" x2="460" y2="451">
          <animate attributeName="stroke-dashoffset" from="0" to="24" dur="0.36s" repeatCount="indefinite"/>
        </line>
      </g>
      <circle cx="300" cy="430" r="11" fill="#5a5a5a"/>
      <circle cx="300" cy="430" r="4" fill="#8d8d8d"/>

      <!-- ---- 链轮 + 曲柄 + 恒水平踏板 ---- -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 460 430" to="360 460 430" dur="0.9s" repeatCount="indefinite"/>
        <circle cx="460" cy="430" r="22" fill="none" stroke="#4a4a4a" stroke-width="4" stroke-dasharray="4 4"/>
        <circle cx="460" cy="430" r="16" fill="#3d3d3d"/>
        <!-- 远曲柄 + 踏板 -->
        <line x1="460" y1="430" x2="426" y2="430" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round"/>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="0 426 430" to="-360 426 430" dur="0.9s" repeatCount="indefinite"/>
          <rect x="412" y="425.5" width="28" height="9" rx="3.5" fill="#b9761c"/>
        </g>
        <!-- 近曲柄 + 踏板 -->
        <line x1="460" y1="430" x2="494" y2="430" stroke="#5a5a5a" stroke-width="7" stroke-linecap="round"/>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="0 494 430" to="-360 494 430" dur="0.9s" repeatCount="indefinite"/>
          <rect x="480" y="425.5" width="28" height="9" rx="3.5" fill="#f2a13c"/>
        </g>
        <circle cx="460" cy="430" r="6" fill="#8d8d8d"/>
      </g>

<script>
  // 点击画面或空格键切换 SMIL 动画的暂停与播放
  const svg = document.querySelector('svg');
  let paused = false;
  const toggle = () => {
    paused = !paused;
    paused ? svg.pauseAnimations() : svg.unpauseAnimations();
  };
  svg.addEventListener('click', toggle);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
  });
</script>
