  <!-- C2: 主表 → deprsum (1:N, deprsum.id = 主表.id) -->
  <path d="M860,280 L860,364 L1120,364 L1120,424" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#mDark)"/>
  <text x="850" y="302" text-anchor="end" font-size="10" font-weight="bold" fill="#475569">1</text>
