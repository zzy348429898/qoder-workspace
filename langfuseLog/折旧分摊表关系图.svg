  <text x="1016" y="128" font-family="Menlo,Consolas,monospace" font-size="10.5" fill="#14532d"><tspan font-weight="bold">① 公司</tspan><tspan font-family="PingFang SC,Microsoft YaHei,sans-serif">：fa_depre_sum.org_id = '2567460264509193216'</tspan></text>
  <text x="1016" y="149" font-family="Menlo,Consolas,monospace" font-size="10.5" fill="#14532d"><tspan font-weight="bold">② 部门</tspan><tspan font-family="PingFang SC,Microsoft YaHei,sans-serif">：subentryentity.asstype1 = 'bos_org'</tspan></text>
