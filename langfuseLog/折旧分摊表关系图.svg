  <text x="1016" y="262" font-family="Menlo,Consolas,monospace" font-size="10.5" fill="#7c2d12"><tspan font-weight="bold">预期</tspan><tspan font-family="PingFang SC,Microsoft YaHei,sans-serif">：4个期间 · lzr-02政策 · 明细34行 · 每卡65元/期</tspan></text>
