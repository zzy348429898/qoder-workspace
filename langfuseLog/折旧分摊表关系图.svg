  <path d="M560,163 L500,163 L500,137 L446,137" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mSlate)"/>
  <rect x="462" y="170" width="88" height="15" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="468" y="181" font-size="10" fill="#475569">公司名称→ID</text>

  <!-- C6: subentryentity.assid1 → 行政组织.id（维度值解析） -->
  <path d="M560,925 L280,925 L280,234" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#mSlate)"/>
  <text x="80" y="955" font-size="11" fill="#64748b">名称→ID 解析：当 asstype1='bos_org' 时，assid1 → 行政组织.id</text>
