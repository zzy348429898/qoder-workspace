  <!-- ============ 连接线 ============ -->
  <!-- C1: 主表 → assentry (1:N, assentry.id = 主表.id) -->
  <path d="M640,280 L640,424" stroke="#334155" stroke-width="2" marker-end="url(#mDark)"/>
  <text x="630" y="302" text-anchor="end" font-size="10" font-weight="bold" fill="#475569">1</text>
