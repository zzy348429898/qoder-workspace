  <text x="938" y="349" font-family="Menlo,Consolas,monospace" font-size="10.5" fill="#334155">deprsum.id = 主表.id</text>

  <!-- C3: assentry → subentryentity (1:N, assentry_id) -->
  <path d="M620,656 L620,784" stroke="#334155" stroke-width="2" marker-end="url(#mDark)"/>
  <text x="610" y="678" text-anchor="end" font-size="10" font-weight="bold" fill="#475569">1</text>
  <text x="610" y="776" text-anchor="end" font-size="10" font-weight="bold" fill="#475569">N</text>
  <rect x="485" y="706" width="272" height="18" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="493" y="719" font-family="Menlo,Consolas,monospace" font-size="10" fill="#334155">subentryentity.assentry_id = assentry.assentry_id</text>

  <!-- C4: assentry ↔ deprsum 卡片级 1:1 配对 -->
  <path d="M804,565 L880,565 L880,539 L954,539" fill="none" stroke="#ea580c" stroke-width="2" marker-start="url(#mOrange)" marker-end="url(#mOrange)"/>
