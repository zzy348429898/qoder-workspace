packages:
  - 'project-*'

# 允许 esbuild 的 postinstall（tsx 依赖，官方包行为安全，等同 npm 默认行为）
# 用于消除 pnpm 11 的 ERR_PNPM_IGNORED_BUILDS 报错
allowBuilds:
  esbuild: true

catalog:
  '@langchain/anthropic': ^0.3.0
  '@langchain/core': ^0.3.0
  '@langchain/langgraph': ^0.2.0
  zod: ^3.23.0
  langchain: ^0.3.0
  express: ^4.21.0
